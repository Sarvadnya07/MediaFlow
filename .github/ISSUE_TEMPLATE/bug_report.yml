name: Bug Report
description: File a bug or unexpected behavior in MediaFlow
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with MediaFlow. Please provide as much context and reproduction detail as possible.
  - type: dropdown
    id: environment-mode
    attributes:
      label: Operating Mode
      description: In which runtime mode did the problem occur?
      options:
        - Desktop Mode (Tauri + React + Python Sidecar)
        - Headless API Mode (FastAPI + Celery + Docker)
        - CLI / Direct Python Execution
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating System & Version
      placeholder: e.g. Windows 11 23H2, Ubuntu 24.04 LTS, macOS Sonoma 14.5
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages or unexpected states)
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step reproduction instructions.
      placeholder: |
        1. Open MediaFlow Desktop
        2. Paste URL 'https://...'
        3. Click 'Analyze Media'
        4. Observe error...
    validations:
      required: true
  - type: textarea
    id: logs-output
    attributes:
      label: Log Output & Diagnostics
      description: Relevant output from `app.log` or diagnostics console (strip any private credentials).
      render: shell
