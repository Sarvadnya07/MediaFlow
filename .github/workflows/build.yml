name: MediaDock Release and Cross-Platform Matrix

on:
  push:
    branches: [ master, main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-python:
    name: Python Engine & Security Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

  test-frontend:
    name: Frontend Quality & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Linter
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Verify Production Bundle
        working-directory: frontend
        run: npm run build

  test-rust:
    name: Rust Desktop Core & Lints
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format Check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy Linter
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run Rust Unit Tests
        working-directory: src-tauri
        run: cargo test

  build-desktop:
    name: Build Native Distributables (${{ matrix.platform }})
    needs: [test-python, test-frontend, test-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-x86_64"
            os: windows-latest
            triple: "x86_64-pc-windows-msvc"
            sidecar_ext: ".exe"
          - platform: "macos-x86_64"
            os: macos-latest
            triple: "x86_64-apple-darwin"
            sidecar_ext: ""
          - platform: "macos-aarch64"
            os: macos-14
            triple: "aarch64-apple-darwin"
            sidecar_ext: ""
          - platform: "linux-x86_64"
            os: ubuntu-22.04
            triple: "x86_64-unknown-linux-gnu"
            sidecar_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Build Python Sidecar Binary
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller packaging/sidecar.spec --noconfirm

      - name: Stage Sidecar with Target Triple
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/mediadock-sidecar.exe src-tauri/binaries/mediadock-sidecar-${{ matrix.triple }}.exe
          else
            cp dist/mediadock-sidecar src-tauri/binaries/mediadock-sidecar-${{ matrix.triple }}
            chmod +x src-tauri/binaries/mediadock-sidecar-${{ matrix.triple }}
          fi

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build Desktop Application (Tauri 2)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "MediaDock v__VERSION__"
          releaseBody: "Automated cross-platform release for MediaDock."
          releaseDraft: true
          prerelease: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediadock-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
