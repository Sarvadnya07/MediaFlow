version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: mediadock
      POSTGRES_PASSWORD: mediadock_password
      POSTGRES_DB: mediadock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mediadock:mediadock_password@db:5432/mediadock
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info -Q downloads
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mediadock:mediadock_password@db:5432/mediadock
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
  downloads:
