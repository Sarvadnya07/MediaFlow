services:
  db:
    image: postgres:16-alpine
    container_name: mediaflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediadock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediadock_password}
      POSTGRES_DB: ${POSTGRES_DB:-mediadock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediadock} -d ${POSTGRES_DB:-mediadock}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediaflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediaflow-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mediadock}:${POSTGRES_PASSWORD:-mediadock_password}@db:5432/${POSTGRES_DB:-mediadock}
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - mediaflow_downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediaflow-worker
    command: celery -A app.worker.celery_app worker --loglevel=info -Q downloads
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mediadock}:${POSTGRES_PASSWORD:-mediadock_password}@db:5432/${POSTGRES_DB:-mediadock}
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - mediaflow_downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mediaflow_downloads:
