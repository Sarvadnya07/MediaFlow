[package]
name = "mediadock"
version = "0.1.0"
description = "MediaDock — Professional Media Downloader and Engine"
authors = ["MediaDock Team"]
edition = "2021"

[lib]
name = "mediadock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
